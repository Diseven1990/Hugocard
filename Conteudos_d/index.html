<html lang="pt-PT">

<meta charset="utf-8">

<title></title>

<style>
:root{
  --bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:rgba(15,23,42,.12);
  --accent:#334155;
}

body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);}

.wrapper{max-width:900px;margin:0 auto;padding:40px 20px 60px;}

h1{font-size:32px;margin-bottom:35px;}

.section{margin-bottom:35px;}

.section h2{font-size:20px;margin-bottom:15px;border-left:4px solid var(--accent);padding-left:10px;}

.card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:.2s ease;position:relative;}

.card:hover{border-color:var(--accent);}

.card:hover .details{display:block;}

.card.open .details{display:block;}

.card-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}

.card-title{font-weight:600;}

.details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}

.details ul{margin:0;padding-left:18px;color:var(--muted);}

.static{cursor:default;}
</style>
</head>

<div class="wrapper">

  section.innerHTML = `<h2>${mod.titulo}</h2>`;

  mod.unidades.forEach(u => {
    const card = document.createElement("div");
    card.className = "card";
    const hasContent = u.topicos && u.topicos.length;

    if(hasContent){
      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">Unidade ${u.n} – ${u.nome}</div>
          <div>▾</div>
        </div>
        <div class="details">
          <ul>
            ${u.topicos.map(t => `<li>${t}</li>`).join("")}
          </ul>
        </div>
      `;

      card.querySelector(".card-header").addEventListener("click", () => {
        card.classList.toggle("open");
      });
    } else {
      card.classList.add("static");
      card.innerHTML = `<div class="card-title">Unidade ${u.n} – ${u.nome}</div>`;
