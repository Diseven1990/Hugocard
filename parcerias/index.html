<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Parcerias</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#000;
width:820px;
height:744px;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;
}

/* cena completa */

.scene{
position:relative;
width:820px;
height:744px;
background:url("fundo.png") no-repeat center;
background-size:820px 744px;
}

/* ecrã do monitor */

.screen{
position:absolute;
left:226px;
top:187px;
width:365px;
height:216px;
background:#000;
overflow:hidden;
}

/* slider */

.viewport{
position:absolute;
inset:0;
display:flex;
align-items:center;
overflow:hidden;
}

.track{
display:flex;
align-items:center;
will-change:transform;
}

.item{
flex:0 0 33.33%;
display:flex;
align-items:center;
justify-content:center;
}

.item img{
max-width:90%;
max-height:85%;
object-fit:contain;
filter:
brightness(1.05)
contrast(1.05)
drop-shadow(0 0 6px rgba(255,255,255,.15));
}

/* painel focus */

.focus-panel{
position:absolute;
inset:0;
display:grid;
place-items:center;
background:#000;
opacity:0;
visibility:hidden;
transition:.2s;
}

.screen.is-focus .focus-panel{
opacity:1;
visibility:visible;
}

.screen.is-focus .track{
opacity:0;
}

.focus-card{
text-align:center;
color:#fff;
padding:10px;
}

.focus-logo{
max-width:130px;
margin-bottom:10px;
}

.focus-desc{
font-size:13px;
line-height:1.4;
}

</style>
</head>

<body>

<div class="scene">

<div class="screen" id="screen">

<div class="viewport">
<div class="track" id="track"></div>
</div>

<div class="focus-panel" id="focusPanel">

<div class="focus-card">
<img id="focusLogo" class="focus-logo">
<p id="focusDesc" class="focus-desc"></p>
</div>

</div>

</div>
</div>

<script>

const companies=[

{
key:"bee",
file:"bee.png",
desc:"Consultora tecnológica focada em transformação digital."
},

{
key:"epopeia",
file:"epopeia.png",
desc:"Estúdio e publisher de videojogos."
},

{
key:"nerd",
file:"nerd.png",
desc:"Estúdio de videojogos multi-plataforma."
},

{
key:"fpe",
file:"fpe.png",
desc:"Federação Portuguesa de Desportos Eletrónicos."
}

];

const screen=document.getElementById("screen");
const track=document.getElementById("track");
const focusLogo=document.getElementById("focusLogo");
const focusDesc=document.getElementById("focusDesc");

let x=0;
let speed=120;
let paused=false;

function build(){

const seq=[...companies,...companies,...companies];

track.innerHTML=seq.map(c=>`

<div class="item" data-key="${c.key}">
<img src="${c.file}">
</div>

`).join("");

track.querySelectorAll(".item").forEach(el=>{

el.addEventListener("mouseenter",()=>focus(el.dataset.key));

});

}

function animate(){

if(!paused){

x-=speed*0.016;

track.style.transform=`translate3d(${x}px,0,0)`;

}

requestAnimationFrame(animate);

}

function focus(key){

const c=companies.find(a=>a.key===key);
if(!c)return;

paused=true;

screen.classList.add("is-focus");

focusLogo.src=c.file;

focusDesc.innerHTML=c.desc;

}

screen.addEventListener("mouseleave",()=>{

screen.classList.remove("is-focus");

paused=false;

});

build();

animate();

</script>

</body>
</html>
