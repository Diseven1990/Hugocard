<script>
const companies = [
  {
    key: "bee",
    file: "bee.png",
    desc: "Consultora tecnológica focada em transformação digital."
  },
  {
    key: "epopeia",
    file: "epopeia.png",
    desc: "Estúdio e publisher de videojogos."
  },
  {
    key: "nerd",
    file: "nerd.png",
    desc: "Estúdio de videojogos multi-plataforma."
  },
  {
    key: "fpe",
    file: "fpe.png",
    desc: "Federação Portuguesa de Desportos Eletrónicos."
  }
];

const screen = document.getElementById("screen");
const track = document.getElementById("track");
const focusLogo = document.getElementById("focusLogo");
const focusDesc = document.getElementById("focusDesc");

const isTouchDevice =
  window.matchMedia("(hover: none)").matches ||
  "ontouchstart" in window ||
  navigator.maxTouchPoints > 0;

let x = 0;
let speed = 120;
let paused = false;
let focusedKey = null;
let itemWidth = 0;

function build() {
  const seq = [...companies, ...companies, ...companies];

  track.innerHTML = seq.map(c => `
    <div class="item" data-key="${c.key}">
      <img src="${c.file}" alt="">
    </div>
  `).join("");

  track.querySelectorAll(".item").forEach(el => {
    const key = el.dataset.key;

    if (!isTouchDevice) {
      el.addEventListener("mouseenter", () => focus(key));
    }

    el.addEventListener("click", (e) => {
      e.stopPropagation();

      if (focusedKey === key) {
        unfocus();
      } else {
        focus(key);
      }
    });
  });
}

function measure() {
  const first = track.querySelector(".item");
  if (!first) return;
  itemWidth = first.getBoundingClientRect().width;
  x = -itemWidth * companies.length;
  track.style.transform = `translate3d(${x}px,0,0)`;
}

function wrap() {
  const loopWidth = itemWidth * companies.length;
  if (!loopWidth) return;

  while (x <= -(loopWidth * 2)) x += loopWidth;
  while (x > -loopWidth) x -= loopWidth;
}

function animate() {
  if (!paused) {
    x -= speed * 0.016;
    wrap();
    track.style.transform = `translate3d(${x}px,0,0)`;
  }

  requestAnimationFrame(animate);
}

function focus(key) {
  const c = companies.find(a => a.key === key);
  if (!c) return;

  focusedKey = key;
  paused = true;
  screen.classList.add("is-focus");
  focusLogo.src = c.file;
  focusDesc.innerHTML = c.desc;
}

function unfocus() {
  focusedKey = null;
  paused = false;
  screen.classList.remove("is-focus");
}

if (!isTouchDevice) {
  screen.addEventListener("mouseleave", () => {
    unfocus();
  });
}

document.addEventListener("click", (e) => {
  if (!screen.contains(e.target)) {
    unfocus();
  }
});

build();
measure();
animate();
</script>
