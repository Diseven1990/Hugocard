<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="./">
  <title>Castle Defender</title>
  <style>
    :root { --game-ratio: 1080 / 608; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #231F20;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    #game-shell {
      width: min(100vw, calc(100vh * var(--game-ratio)));
      height: min(100vh, calc(100vw / var(--game-ratio)));
      aspect-ratio: var(--game-ratio);
      display: grid;
      place-items: center;
      background: #231F20;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #231F20;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="unity-canvas" width="1080" height="608" tabindex="-1"></canvas>
  </div>

  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const shell = document.querySelector("#game-shell");

    function resizeCanvas() {
      const rect = shell.getBoundingClientRect();
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Master.D",
      productName: "Castle Defender",
      productVersion: "1.0"
    }).then(() => {
      resizeCanvas();
    }).catch((message) => {
      console.error(message);
      alert(message);
    });
  </script>
</body>
</html>
