<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Castle Defender</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; background: #231F20;">
    <canvas id="unity-canvas" width="1080" height="608" style="width: 1080px; height: 608px; background: #231F20"></canvas>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector('#unity-canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.position = 'fixed';

        document.body.style.textAlign = 'left';
      }

      createUnityInstance(document.querySelector('#unity-canvas'), {
        dataUrl: 'Build/WebGL.data',
        frameworkUrl: 'Build/WebGL.framework.js',
        codeUrl: 'Build/WebGL.wasm',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Master.D',
        productName: 'Castle Defender',
        productVersion: '1.0'
      }).catch(function(message) {
        console.error(message);
        alert(message);
      });
    </script>
  </body>
</html>
