<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Castle Defender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #231F20;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-container {
      position: relative;
      width: 1080px;
      height: 608px;
    }

    #unity-canvas {
      width: 1080px;
      height: 608px;
      display: block;
      background: #231F20;
    }

    #loading {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="loading">A carregar...</div>
  </div>

  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");

    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Master.D",
      productName: "Castle Defender",
      productVersion: "1.0"
    }).then(() => {
      loading.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
