<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <base href="./">
    <title>Castle Defender</title>
    <style>
      html, body {
        width: 100%; height: 100%; margin: 0; padding: 0; background: #231F20; overflow: hidden;
      }
      body { display:flex; align-items:center; justify-content:center; }
      #game-wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#231F20; }
      #unity-canvas { display:block; width:100vw; height:100vh; max-width:100%; max-height:100%; background:#231F20; outline:none; }
      @media (min-aspect-ratio: 1080/608) { #unity-canvas { width:auto; height:100vh; aspect-ratio:1080/608; } }
      @media (max-aspect-ratio: 1080/608) { #unity-canvas { width:100vw; height:auto; aspect-ratio:1080/608; } }
    </style>
  </head>
  <body>
    <div id="game-wrap">
      <canvas id="unity-canvas" width="1080" height="608" tabindex="-1"></canvas>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
      createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Master.D",
        productName: "Castle Defender",
        productVersion: "1.0"
      }).catch((message) => {
        console.error(message);
        alert(message);
      });
    </script>
  </body>
</html>
